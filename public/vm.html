<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Node Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090b12;--panel:#0d0f1a;--s1:#0f1120;--border:rgba(255,255,255,.07);
  --accent:#00d4ff;--green:#3fdc8a;--red:#f87171;--yellow:#facc15;--org:#ff9a4a;
  --text:#c8d2e6;--dim:rgba(200,210,230,.35);--fm:'JetBrains Mono',monospace,system-ui;
}
body{background:var(--bg);color:var(--text);font-family:var(--fm);font-size:12px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:14px;height:48px;flex-shrink:0;}
.logo{color:var(--accent);font-weight:800;font-size:14px;letter-spacing:1px;}
.sep{width:1px;height:22px;background:var(--border);}
.spacer{flex:1;}
.nav a{color:var(--dim);font-size:10px;text-decoration:none;margin-left:14px;}
.nav a:hover,.nav a.active{color:var(--accent);}
.content{flex:1;display:flex;overflow:hidden;}
/* Left sidebar */
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.sidebar-title{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;flex:1;}
.add-btn{padding:4px 10px;border-radius:5px;background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.2);font-family:var(--fm);font-size:9px;font-weight:700;cursor:pointer;}
.add-btn:hover{background:rgba(0,212,255,.2);}
.node-list{flex:1;overflow-y:auto;padding:6px;}
.section-label{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:8px 6px 4px;border-top:1px solid var(--border);margin-top:4px;}
.section-label:first-child{border-top:none;margin-top:0;}
.node-item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all .12s;}
.node-item:hover{background:rgba(255,255,255,.04);}
.node-item.selected{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.2);}
.node-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.node-name{font-size:11px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.node-ip{font-size:8px;color:var(--dim);}
.type-badge{font-size:7px;padding:1px 4px;border-radius:3px;font-weight:700;text-transform:uppercase;flex-shrink:0;}
/* Detail panel */
.detail{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);font-size:11px;}
/* Cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-head{padding:9px 14px;border-bottom:1px solid var(--border);font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:8px;}
.card-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.field-row{display:flex;align-items:center;gap:8px;}
.field-label{font-size:9px;color:var(--dim);width:72px;flex-shrink:0;}
input[type=text],input[type=number],select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:10px;color:#e8ecf4;font-family:var(--fm);outline:none;transition:border-color .12s;}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:rgba(0,212,255,.35);}
select{cursor:pointer;}
select option{background:#0d0f1a;}
textarea{resize:vertical;min-height:90px;line-height:1.6;width:100%;}
.word-count{font-size:8px;color:var(--dim);text-align:right;margin-top:2px;}
.word-count.over{color:var(--yellow);}
.tags{display:flex;flex-wrap:wrap;gap:4px;min-height:22px;}
.tag{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;cursor:pointer;}
.tag:hover{opacity:.7;}
.tag-add-row{display:flex;gap:6px;margin-top:4px;}
.btn{padding:5px 12px;border-radius:5px;border:none;font-family:var(--fm);font-size:10px;font-weight:700;cursor:pointer;}
.btn-save{background:rgba(63,220,138,.15);color:var(--green);border:1px solid rgba(63,220,138,.3);}
.btn-save:hover{background:rgba(63,220,138,.25);}
.btn-sm{font-size:9px;padding:3px 8px;}
.btn-del-node{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2);}
.btn-del-node:hover{background:rgba(248,113,113,.2);}
.btn-ping{background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.2);}
.btn-ping:hover{background:rgba(0,212,255,.2);}
/* Training */
.train-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;padding:7px 9px;display:flex;gap:8px;align-items:flex-start;}
.train-body{flex:1;}
.train-line{font-size:9px;color:var(--dim);margin-bottom:1px;}
.train-line span{color:#e8ecf4;}
.train-line.do span{color:#93c5fd;}
.del-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:10px;}
.del-btn:hover{color:var(--red);}
/* Node header */
.node-header{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.node-badge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0;}
.node-title{font-size:16px;font-weight:800;}
.node-sub{font-size:9px;color:var(--dim);margin-top:2px;}
.ping-result{font-size:9px;padding:2px 8px;border-radius:4px;margin-left:8px;}
.ping-ok{background:rgba(63,220,138,.15);color:var(--green);}
.ping-fail{background:rgba(248,113,113,.12);color:var(--red);}
/* Add node modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#0d0f1a;border:1px solid rgba(0,212,255,.2);border-radius:12px;padding:20px;width:420px;max-width:95vw;display:flex;flex-direction:column;gap:12px;}
.modal-title{font-size:13px;font-weight:800;color:var(--accent);}
.modal-field{display:flex;flex-direction:column;gap:4px;}
.modal-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px;}
.tog{width:32px;height:18px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.tog.on{background:rgba(63,220,138,.35);border-color:rgba(63,220,138,.5);}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#666;transition:left .2s,background .2s;}
.tog.on::after{left:16px;background:var(--green);}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1f2e;border:1px solid rgba(0,212,255,.3);border-radius:8px;padding:8px 16px;font-size:11px;color:#e8ecf4;z-index:200;display:none;}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">🖥 NODE MANAGER</span>
  <div class="sep"></div>
  <span style="font-size:10px;color:var(--dim)" id="node-count-label">Loading…</span>
  <div class="spacer"></div>
  <div class="nav">
    <a href="/">Agent</a>
    <a href="/vm" class="active">VMs</a>
    <a href="/slaves">Fleet</a>
    <a href="/setup">Setup</a>
  </div>
</div>

<div class="content">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-title">All Nodes</span>
      <button class="add-btn" onclick="openAddModal()">+ Add</button>
    </div>
    <div class="node-list" id="node-list"></div>
  </div>

  <!-- Detail -->
  <div class="detail" id="detail">
    <div class="empty-state">Select a node or click + Add to register one</div>
  </div>
</div>

<!-- Add Node Modal -->
<div class="modal-bg" id="add-modal">
  <div class="modal">
    <div class="modal-title">Register New Node</div>
    <div class="modal-field">
      <div class="modal-label">Name</div>
      <input type="text" id="m-name" placeholder="e.g. Repeat Jobs VM" style="width:100%"/>
    </div>
    <div class="modal-field">
      <div class="modal-label">IP Address</div>
      <input type="text" id="m-ip" placeholder="192.168.0.36" style="width:100%"/>
    </div>
    <div style="display:flex;gap:8px;">
      <div class="modal-field" style="flex:1;">
        <div class="modal-label">Port</div>
        <input type="number" id="m-port" value="8080" style="width:100%"/>
      </div>
      <div class="modal-field" style="flex:1;">
        <div class="modal-label">Type</div>
        <select id="m-type" style="width:100%;height:28px;">
          <option value="vm">VM</option>
          <option value="lxc">LXC</option>
          <option value="server">Server</option>
          <option value="container">Container</option>
          <option value="browser-vm">Browser VM</option>
        </select>
      </div>
      <div class="modal-field" style="flex:1;">
        <div class="modal-label">Send via</div>
        <select id="m-send" style="width:100%;height:28px;">
          <option value="webhook">Webhook</option>
          <option value="run">Run API</option>
          <option value="ssh">SSH</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" style="background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--border);" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-save" onclick="addNode()">Add Node</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Browser VM definitions (profiles 1-8, always present) ──────────────────
const BROWSER_VMS = [
  {id:'bvm-1', profile:1, name:'Jarvis',      ip:'192.168.0.8',  color:'#a78bfa', label:'J', type:'browser-vm'},
  {id:'bvm-2', profile:2, name:'SAM Main',    ip:'192.168.0.9',  color:'#60a5fa', label:'S', type:'browser-vm'},
  {id:'bvm-3', profile:3, name:'PTNR',        ip:'192.168.0.10', color:'#34d399', label:'P', type:'browser-vm'},
  {id:'bvm-4', profile:4, name:'HOUSE',       ip:'192.168.0.11', color:'#facc15', label:'H', type:'browser-vm'},
  {id:'bvm-5', profile:5, name:'AI',          ip:'192.168.0.12', color:'#f87171', label:'A', type:'browser-vm'},
  {id:'bvm-6', profile:6, name:'Personal',    ip:'192.168.0.13', color:'#fb923c', label:'P', type:'browser-vm'},
  {id:'bvm-7', profile:7, name:'Personal 2',  ip:'192.168.0.14', color:'#e879f9', label:'2', type:'browser-vm'},
  {id:'bvm-8', profile:8, name:'Sole Trader', ip:'192.168.0.15', color:'#38bdf8', label:'T', type:'browser-vm'},
];

let _vmAssignments = {};
let _nodes         = [];   // general nodes from nodes.json
let _health        = {};
let _workerJobs    = [];
let _selectedId    = null;

function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `${r},${g},${b}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';t.style.borderColor=err?'rgba(248,113,113,.4)':'rgba(0,212,255,.3)';setTimeout(()=>t.style.display='none',2500);}

const TYPE_COLORS = {
  'vm':'#60a5fa','lxc':'#34d399','server':'#facc15','container':'#fb923c',
  'browser-vm':'#a78bfa','ssh':'#f87171'
};
const TYPE_ICONS = {'vm':'🖥','lxc':'📦','server':'🗄','container':'🐳','browser-vm':'🌐','ssh':'🔑'};

async function init() {
  const [asn, nd, wj, fleet] = await Promise.all([
    fetch('/api/vms/assignments').then(r=>r.json()).catch(()=>({})),
    fetch('/api/nodes').then(r=>r.json()).catch(()=>({nodes:[]})),
    fetch('/api/worker-jobs').then(r=>r.json()).catch(()=>({jobs:[]})),
    fetch('/api/slaves/fleet').then(r=>r.json()).catch(()=>({nodes:[]})),
  ]);
  _vmAssignments = asn;
  _nodes         = nd.nodes || [];
  _workerJobs    = wj.jobs || [];
  (fleet.nodes||[]).forEach(n => _health[n.ip] = n.health);
  renderSidebar();
  document.getElementById('node-count-label').textContent =
    `${BROWSER_VMS.length} Browser VMs · ${_nodes.length} Custom Node${_nodes.length!==1?'s':''}`;
}

function renderSidebar() {
  const el = document.getElementById('node-list');
  let html = '';

  // Browser VMs section
  html += `<div class="section-label">Browser VMs (8)</div>`;
  BROWSER_VMS.forEach(vm => {
    const asn    = _vmAssignments[String(vm.profile)] || {};
    const online = _health[vm.ip] === 'online';
    const sel    = _selectedId === vm.id;
    html += `<div class="node-item${sel?' selected':''}" onclick="selectNode('${vm.id}')" id="ni-${vm.id}">
      <span class="node-dot" style="${online?`background:${vm.color};box-shadow:0 0 4px ${vm.color}`:'background:#f87171'}"></span>
      <div style="flex:1;min-width:0;">
        <div class="node-name" style="color:${vm.color}">${asn.name||vm.name}</div>
        <div class="node-ip">${vm.ip}</div>
      </div>
      <span class="type-badge" style="background:rgba(167,139,250,.12);color:#a78bfa;">VM</span>
    </div>`;
  });

  // Custom nodes section
  html += `<div class="section-label">Custom Nodes (${_nodes.length})</div>`;
  if (!_nodes.length) {
    html += `<div style="font-size:9px;color:var(--dim);padding:6px 8px;">No nodes yet — click + Add</div>`;
  }
  _nodes.forEach(node => {
    const sel   = _selectedId === node.id;
    const color = TYPE_COLORS[node.type] || '#60a5fa';
    html += `<div class="node-item${sel?' selected':''}" onclick="selectNode('${node.id}')" id="ni-${node.id}">
      <span class="node-dot" style="background:${color}"></span>
      <div style="flex:1;min-width:0;">
        <div class="node-name" style="color:${color}">${esc(node.name)}</div>
        <div class="node-ip">${node.ip}:${node.port||8080}</div>
      </div>
      <span class="type-badge" style="background:rgba(96,165,250,.1);color:${color};">${node.type.toUpperCase()}</span>
    </div>`;
  });

  el.innerHTML = html;
}

function selectNode(id) {
  _selectedId = id;
  renderSidebar();
  // Browser VM?
  const bvm = BROWSER_VMS.find(v => v.id === id);
  if (bvm) { renderBrowserVM(bvm); return; }
  // Custom node?
  const node = _nodes.find(n => n.id === id);
  if (node) { renderCustomNode(node); }
}

// ── Browser VM detail ──────────────────────────────────────────────────────────
function renderBrowserVM(vm) {
  const asn   = _vmAssignments[String(vm.profile)] || {};
  const c     = vm.color;
  const rgb   = hexToRgb(c);
  const online = _health[vm.ip] === 'online';
  const words = (asn.description||'').trim().split(/\s+/).filter(Boolean).length;

  const catHtml = (asn.categories||[]).map(cat =>
    `<span class="tag" style="background:rgba(${rgb},.12);color:${c};border:1px solid rgba(${rgb},.25);" onclick="bvmRemoveCat(${vm.profile},'${esc(cat)}')">${esc(cat)} ✕</span>`
  ).join('');
  const specHtml = (asn.specialties||[]).map(s =>
    `<span class="tag" style="background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.1);" onclick="bvmRemoveSpec(${vm.profile},'${esc(s)}')">${esc(s)} ✕</span>`
  ).join('');
  const trainingHtml = (asn.training||[]).map(t =>
    `<div class="train-item"><div class="train-body">
      <div class="train-line">When: <span>${esc(t.trigger)}</span></div>
      <div class="train-line do">Do: <span>${esc(t.behavior)}</span></div>
    </div><button class="del-btn" onclick="bvmDelTrain(${vm.profile},'${t.id}')">✕</button></div>`
  ).join('');
  const jobsHtml = _workerJobs.map(j => {
    const assigned = (asn.job_ids||[]).includes(j.id);
    return `<label style="display:flex;align-items:center;gap:6px;font-size:9px;color:${assigned?'#e8ecf4':'var(--dim)'};cursor:pointer;padding:2px 0;">
      <input type="checkbox" ${assigned?'checked':''} onchange="bvmToggleJob(${vm.profile},'${j.id}',this.checked)" style="accent-color:${c};cursor:pointer;"/>
      ${esc(j.name)} <span style="color:var(--dim);font-size:8px;margin-left:4px;">${esc(j.description||'').slice(0,40)}</span>
    </label>`;
  }).join('');

  document.getElementById('detail').innerHTML = `
    <div class="node-header" style="border-color:rgba(${rgb},.2);">
      <div class="node-badge" style="background:rgba(${rgb},.12);border:1px solid rgba(${rgb},.2);color:${c};">${vm.label}</div>
      <div>
        <div class="node-title" style="color:${c};">${esc(asn.name||vm.name)}</div>
        <div class="node-sub">${vm.ip} · Browser VM · Profile ${vm.profile} · PIA ${asn.notes?.match(/PIA (#\d)/)?.[1]||'?'}</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <button class="btn btn-ping btn-sm" onclick="pingNode('${vm.ip}',8080,'ping-${vm.profile}')">Ping</button>
        <span id="ping-${vm.profile}"></span>
        <label style="display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);cursor:pointer;">
          AUTO <div class="tog${asn.auto_eligible!==false?' on':''}" id="bvm-auto-${vm.profile}" onclick="bvmToggleAuto(${vm.profile})"></div>
        </label>
        <span style="width:9px;height:9px;border-radius:50%;${online?`background:${c};box-shadow:0 0 5px ${c}`:'background:#f87171'};display:inline-block;"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Staff &amp; Description</div>
      <div class="card-body">
        <div class="field-row"><span class="field-label">Staff name</span><input type="text" id="bvm-staff-${vm.profile}" value="${esc(asn.staff||asn.name||vm.name)}" style="flex:1;"/></div>
        <div>
          <div style="font-size:9px;color:var(--dim);margin-bottom:4px;">What this VM does (up to 200 words)</div>
          <textarea id="bvm-desc-${vm.profile}" oninput="updateWC('bvm-wc-${vm.profile}',this)">${esc(asn.description||'')}</textarea>
          <div class="word-count${words>200?' over':''}" id="bvm-wc-${vm.profile}">${words} / 200</div>
        </div>
        <div style="text-align:right;"><button class="btn btn-save btn-sm" onclick="bvmSaveBasic(${vm.profile})">Save</button></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Route Categories <span style="font-size:8px;color:var(--dim);font-weight:400;text-transform:none;margin-left:6px;">Tasks with these keywords auto-route here</span></div>
      <div class="card-body">
        <div class="tags" id="bvm-cats-${vm.profile}">${catHtml||'<span style="font-size:9px;color:var(--dim);">None set</span>'}</div>
        <div class="tag-add-row">
          <input type="text" id="bvm-cat-inp-${vm.profile}" placeholder="e.g. flights, gym, shopping…" style="flex:1;" onkeydown="if(event.key==='Enter')bvmAddCat(${vm.profile})"/>
          <button class="btn btn-save btn-sm" onclick="bvmAddCat(${vm.profile})">+ Add</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Specialties</div>
      <div class="card-body">
        <div class="tags" id="bvm-specs-${vm.profile}">${specHtml||'<span style="font-size:9px;color:var(--dim);">None set</span>'}</div>
        <div class="tag-add-row">
          <input type="text" id="bvm-spec-inp-${vm.profile}" placeholder="e.g. SkyScanner, Amazon, PureGym…" style="flex:1;" onkeydown="if(event.key==='Enter')bvmAddSpec(${vm.profile})"/>
          <button class="btn btn-save btn-sm" onclick="bvmAddSpec(${vm.profile})">+ Add</button>
        </div>
      </div>
    </div>

    ${_workerJobs.length ? `<div class="card">
      <div class="card-head">Assigned Worker Jobs <span style="color:var(--accent);margin-left:6px;">${(asn.job_ids||[]).length}/${_workerJobs.length}</span></div>
      <div class="card-body">${jobsHtml}</div>
    </div>` : ''}

    <div class="card">
      <div class="card-head">Training <span style="color:var(--accent);margin-left:6px;">${(asn.training||[]).length}</span></div>
      <div class="card-body">
        ${trainingHtml ? `<div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px;">${trainingHtml}</div>` : ''}
        <div style="background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:6px;">
          <input type="text" id="bvm-trw-${vm.profile}" placeholder="When I say… e.g. check flights"/>
          <textarea id="bvm-trd-${vm.profile}" placeholder="Do this… e.g. Open SkyScanner, search London to Amsterdam, return 3 cheapest" style="min-height:55px;"></textarea>
          <button class="btn btn-save btn-sm" onclick="bvmAddTrain(${vm.profile})" style="align-self:flex-end;">+ Add Training</button>
        </div>
      </div>
    </div>
  `;
}

// ── Custom Node detail ─────────────────────────────────────────────────────────
function renderCustomNode(node) {
  const c   = TYPE_COLORS[node.type] || '#60a5fa';
  const rgb = hexToRgb(c);
  const icon = TYPE_ICONS[node.type] || '🖥';
  const words = (node.description||'').trim().split(/\s+/).filter(Boolean).length;

  const catHtml = (node.categories||[]).map(cat =>
    `<span class="tag" style="background:rgba(${rgb},.12);color:${c};border:1px solid rgba(${rgb},.25);" onclick="nodeRemoveCat('${node.id}','${esc(cat)}')">${esc(cat)} ✕</span>`
  ).join('');
  const specHtml = (node.specialties||[]).map(s =>
    `<span class="tag" style="background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.1);" onclick="nodeRemoveSpec('${node.id}','${esc(s)}')">${esc(s)} ✕</span>`
  ).join('');
  const trainingHtml = (node.training||[]).map(t =>
    `<div class="train-item"><div class="train-body">
      <div class="train-line">When: <span>${esc(t.trigger)}</span></div>
      <div class="train-line do">Do: <span>${esc(t.behavior)}</span></div>
    </div><button class="del-btn" onclick="nodeDelTrain('${node.id}','${t.id}')">✕</button></div>`
  ).join('');

  document.getElementById('detail').innerHTML = `
    <div class="node-header" style="border-color:rgba(${rgb},.2);">
      <div class="node-badge" style="background:rgba(${rgb},.12);border:1px solid rgba(${rgb},.2);color:${c};">${icon}</div>
      <div>
        <div class="node-title" style="color:${c};">${esc(node.name)}</div>
        <div class="node-sub">${node.ip}:${node.port||8080} · ${node.type.toUpperCase()} · Send: ${node.send_method||'webhook'}</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <button class="btn btn-ping btn-sm" onclick="pingNode('${node.ip}',${node.port||8080},'ping-${node.id}')">Ping</button>
        <span id="ping-${node.id}"></span>
        <label style="display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);cursor:pointer;">
          AUTO <div class="tog${node.auto_eligible!==false?' on':''}" id="node-auto-${node.id}" onclick="nodeToggleAuto('${node.id}')"></div>
        </label>
        <button class="btn btn-del-node btn-sm" onclick="deleteNode('${node.id}')">Delete</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Info &amp; Description</div>
      <div class="card-body">
        <div class="field-row"><span class="field-label">Name</span><input type="text" id="nd-name-${node.id}" value="${esc(node.name)}" style="flex:1;"/></div>
        <div class="field-row">
          <span class="field-label">IP : Port</span>
          <input type="text" id="nd-ip-${node.id}" value="${esc(node.ip)}" style="flex:1;" placeholder="192.168.0.36"/>
          <span style="color:var(--dim);padding:0 4px;">:</span>
          <input type="number" id="nd-port-${node.id}" value="${node.port||8080}" style="width:70px;"/>
        </div>
        <div class="field-row">
          <span class="field-label">Type</span>
          <select id="nd-type-${node.id}" style="flex:1;">
            ${['vm','lxc','server','container','browser-vm','ssh'].map(t=>`<option value="${t}"${node.type===t?' selected':''}>${t.toUpperCase()}</option>`).join('')}
          </select>
          <span class="field-label" style="margin-left:8px;">Send via</span>
          <select id="nd-send-${node.id}" style="flex:1;">
            ${['webhook','run','ssh'].map(t=>`<option value="${t}"${(node.send_method||'webhook')===t?' selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div>
          <div style="font-size:9px;color:var(--dim);margin-bottom:4px;">What this node does — describe its jobs, tools, scripts (up to 200 words)</div>
          <textarea id="nd-desc-${node.id}" oninput="updateWC('nd-wc-${node.id}',this)">${esc(node.description||'')}</textarea>
          <div class="word-count${words>200?' over':''}" id="nd-wc-${node.id}">${words} / 200</div>
        </div>
        <div style="text-align:right;"><button class="btn btn-save btn-sm" onclick="nodeSaveBasic('${node.id}')">Save</button></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Route Categories <span style="font-size:8px;color:var(--dim);font-weight:400;text-transform:none;margin-left:6px;">Tasks with these keywords auto-route here</span></div>
      <div class="card-body">
        <div class="tags" id="nd-cats-${node.id}">${catHtml||'<span style="font-size:9px;color:var(--dim);">None set</span>'}</div>
        <div class="tag-add-row">
          <input type="text" id="nd-cat-inp-${node.id}" placeholder="e.g. repeat, cron, backup, report…" style="flex:1;" onkeydown="if(event.key==='Enter')nodeAddCat('${node.id}')"/>
          <button class="btn btn-save btn-sm" onclick="nodeAddCat('${node.id}')">+ Add</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Specialties</div>
      <div class="card-body">
        <div class="tags" id="nd-specs-${node.id}">${specHtml||'<span style="font-size:9px;color:var(--dim);">None set</span>'}</div>
        <div class="tag-add-row">
          <input type="text" id="nd-spec-inp-${node.id}" placeholder="e.g. Python scripts, database, cron jobs…" style="flex:1;" onkeydown="if(event.key==='Enter')nodeAddSpec('${node.id}')"/>
          <button class="btn btn-save btn-sm" onclick="nodeAddSpec('${node.id}')">+ Add</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Training <span style="color:var(--accent);margin-left:6px;">${(node.training||[]).length}</span></div>
      <div class="card-body">
        ${trainingHtml ? `<div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px;">${trainingHtml}</div>` : ''}
        <div style="background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:6px;">
          <input type="text" id="nd-trw-${node.id}" placeholder="When I say… e.g. run daily report"/>
          <textarea id="nd-trd-${node.id}" placeholder="Do this… e.g. SSH to this server and run /scripts/daily-report.sh, return the output" style="min-height:55px;"></textarea>
          <button class="btn btn-save btn-sm" onclick="nodeAddTrain('${node.id}')" style="align-self:flex-end;">+ Add Training</button>
        </div>
      </div>
    </div>
  `;
}

function updateWC(id, ta) {
  const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
  const el = document.getElementById(id);
  if (el) { el.textContent = `${n} / 200`; el.className = 'word-count'+(n>200?' over':''); }
}

// ── Ping ───────────────────────────────────────────────────────────────────────
async function pingNode(ip, port, elId) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = `<span style="font-size:9px;color:var(--dim);">…</span>`;
  try {
    const d = await fetch('/api/nodes/ping', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ip, port})
    }).then(r=>r.json());
    if (el) el.innerHTML = d.online
      ? `<span class="ping-result ping-ok">Online</span>`
      : `<span class="ping-result ping-fail">Offline</span>`;
    _health[ip] = d.online ? 'online' : 'offline';
    renderSidebar();
  } catch(e) {
    if (el) el.innerHTML = `<span class="ping-result ping-fail">Error</span>`;
  }
}

// ── Add node modal ─────────────────────────────────────────────────────────────
function openAddModal() { document.getElementById('add-modal').classList.add('open'); }
function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }
async function addNode() {
  const name = document.getElementById('m-name').value.trim();
  const ip   = document.getElementById('m-ip').value.trim();
  const port = parseInt(document.getElementById('m-port').value)||8080;
  const type = document.getElementById('m-type').value;
  const send = document.getElementById('m-send').value;
  if (!name||!ip) { toast('Name and IP required', true); return; }
  const d = await fetch('/api/nodes', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, ip, port, type, send_method: send})
  }).then(r=>r.json());
  if (d.error) { toast(d.error, true); return; }
  _nodes.push(d.node);
  closeAddModal();
  document.getElementById('m-name').value='';
  document.getElementById('m-ip').value='';
  document.getElementById('node-count-label').textContent =
    `${BROWSER_VMS.length} Browser VMs · ${_nodes.length} Custom Node${_nodes.length!==1?'s':''}`;
  renderSidebar();
  selectNode(d.node.id);
  toast(`Node "${name}" added`);
}

// ── Delete node ────────────────────────────────────────────────────────────────
async function deleteNode(id) {
  if (!confirm('Remove this node?')) return;
  await fetch(`/api/nodes/${id}`, {method:'DELETE'});
  _nodes = _nodes.filter(n=>n.id!==id);
  _selectedId = null;
  document.getElementById('detail').innerHTML = '<div class="empty-state">Node removed</div>';
  document.getElementById('node-count-label').textContent =
    `${BROWSER_VMS.length} Browser VMs · ${_nodes.length} Custom Node${_nodes.length!==1?'s':''}`;
  renderSidebar();
  toast('Node removed');
}

// ── Browser VM helpers ─────────────────────────────────────────────────────────
async function bvmPatch(profile, data) {
  await fetch(`/api/vms/assignments/${profile}`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  Object.assign(_vmAssignments[String(profile)], data);
}
async function bvmSaveBasic(profile) {
  const staff = document.getElementById(`bvm-staff-${profile}`)?.value?.trim();
  const desc  = document.getElementById(`bvm-desc-${profile}`)?.value?.trim();
  await bvmPatch(profile, {staff, description: desc});
  toast('Saved');
}
async function bvmAddCat(profile) {
  const inp = document.getElementById(`bvm-cat-inp-${profile}`);
  const val = inp?.value?.trim(); if(!val) return;
  const cur = _vmAssignments[String(profile)].categories||[];
  if(cur.includes(val)){inp.value='';return;}
  cur.push(val); await bvmPatch(profile,{categories:cur}); inp.value='';
  renderBrowserVM(BROWSER_VMS.find(v=>v.profile===profile));
}
async function bvmRemoveCat(profile, cat) {
  const cur = (_vmAssignments[String(profile)].categories||[]).filter(c=>c!==cat);
  await bvmPatch(profile,{categories:cur});
  renderBrowserVM(BROWSER_VMS.find(v=>v.profile===profile));
}
async function bvmAddSpec(profile) {
  const inp = document.getElementById(`bvm-spec-inp-${profile}`);
  const val = inp?.value?.trim(); if(!val) return;
  const cur = _vmAssignments[String(profile)].specialties||[];
  if(cur.includes(val)){inp.value='';return;}
  cur.push(val); await bvmPatch(profile,{specialties:cur}); inp.value='';
  renderBrowserVM(BROWSER_VMS.find(v=>v.profile===profile));
}
async function bvmRemoveSpec(profile, spec) {
  const cur = (_vmAssignments[String(profile)].specialties||[]).filter(s=>s!==spec);
  await bvmPatch(profile,{specialties:cur});
  renderBrowserVM(BROWSER_VMS.find(v=>v.profile===profile));
}
async function bvmToggleJob(profile, jobId, checked) {
  const cur = _vmAssignments[String(profile)].job_ids||[];
  const upd = checked ? [...new Set([...cur,jobId])] : cur.filter(id=>id!==jobId);
  await bvmPatch(profile,{job_ids:upd});
}
async function bvmToggleAuto(profile) {
  const cur = _vmAssignments[String(profile)].auto_eligible!==false;
  const nxt = !cur; await bvmPatch(profile,{auto_eligible:nxt});
  document.getElementById(`bvm-auto-${profile}`)?.classList.toggle('on',nxt);
  renderSidebar(); toast(`VM ${profile} AUTO: ${nxt?'ON':'OFF'}`);
}
async function bvmAddTrain(profile) {
  const trigger  = document.getElementById(`bvm-trw-${profile}`)?.value?.trim();
  const behavior = document.getElementById(`bvm-trd-${profile}`)?.value?.trim();
  if(!trigger||!behavior){toast('Fill both fields',true);return;}
  await fetch(`/api/vms/assignments/${profile}/training`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trigger,behavior})});
  const asn = await fetch('/api/vms/assignments').then(r=>r.json());
  _vmAssignments = asn;
  renderBrowserVM(BROWSER_VMS.find(v=>v.profile===profile));
  toast('Training added');
}
async function bvmDelTrain(profile, id) {
  await fetch(`/api/vms/assignments/${profile}/training/${id}`,{method:'DELETE'});
  const asn = await fetch('/api/vms/assignments').then(r=>r.json());
  _vmAssignments = asn;
  renderBrowserVM(BROWSER_VMS.find(v=>v.profile===profile));
}

// ── Custom node helpers ────────────────────────────────────────────────────────
async function nodePatch(id, data) {
  await fetch(`/api/nodes/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const node = _nodes.find(n=>n.id===id);
  if(node) Object.assign(node, data);
}
async function nodeSaveBasic(id) {
  const node = _nodes.find(n=>n.id===id); if(!node) return;
  const name = document.getElementById(`nd-name-${id}`)?.value?.trim();
  const ip   = document.getElementById(`nd-ip-${id}`)?.value?.trim();
  const port = parseInt(document.getElementById(`nd-port-${id}`)?.value)||8080;
  const type = document.getElementById(`nd-type-${id}`)?.value;
  const send = document.getElementById(`nd-send-${id}`)?.value;
  const desc = document.getElementById(`nd-desc-${id}`)?.value?.trim();
  await nodePatch(id,{name,port,type,send_method:send,description:desc});
  if(ip && ip!==node.ip) await nodePatch(id,{ip}); // IP change requires full reload
  renderSidebar(); renderCustomNode(_nodes.find(n=>n.id===id));
  toast('Saved');
}
async function nodeAddCat(id) {
  const inp = document.getElementById(`nd-cat-inp-${id}`);
  const val = inp?.value?.trim(); if(!val) return;
  const node = _nodes.find(n=>n.id===id); if(!node) return;
  const cur = node.categories||[];
  if(cur.includes(val)){inp.value='';return;}
  cur.push(val); await nodePatch(id,{categories:cur}); inp.value='';
  renderCustomNode(node);
}
async function nodeRemoveCat(id, cat) {
  const node = _nodes.find(n=>n.id===id); if(!node) return;
  const cur = (node.categories||[]).filter(c=>c!==cat);
  await nodePatch(id,{categories:cur}); renderCustomNode(node);
}
async function nodeAddSpec(id) {
  const inp = document.getElementById(`nd-spec-inp-${id}`);
  const val = inp?.value?.trim(); if(!val) return;
  const node = _nodes.find(n=>n.id===id); if(!node) return;
  const cur = node.specialties||[];
  if(cur.includes(val)){inp.value='';return;}
  cur.push(val); await nodePatch(id,{specialties:cur}); inp.value='';
  renderCustomNode(node);
}
async function nodeRemoveSpec(id, spec) {
  const node = _nodes.find(n=>n.id===id); if(!node) return;
  const cur = (node.specialties||[]).filter(s=>s!==spec);
  await nodePatch(id,{specialties:cur}); renderCustomNode(node);
}
async function nodeToggleAuto(id) {
  const node = _nodes.find(n=>n.id===id); if(!node) return;
  const nxt = !node.auto_eligible;
  await nodePatch(id,{auto_eligible:nxt});
  document.getElementById(`node-auto-${id}`)?.classList.toggle('on',nxt);
  renderSidebar(); toast(`Node AUTO: ${nxt?'ON':'OFF'}`);
}
async function nodeAddTrain(id) {
  const trigger  = document.getElementById(`nd-trw-${id}`)?.value?.trim();
  const behavior = document.getElementById(`nd-trd-${id}`)?.value?.trim();
  if(!trigger||!behavior){toast('Fill both fields',true);return;}
  await fetch(`/api/nodes/${id}/training`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trigger,behavior})});
  const nd = await fetch('/api/nodes').then(r=>r.json());
  _nodes = nd.nodes||[];
  renderCustomNode(_nodes.find(n=>n.id===id));
  toast('Training added');
}
async function nodeDelTrain(id, trainId) {
  await fetch(`/api/nodes/${id}/training/${trainId}`,{method:'DELETE'});
  const nd = await fetch('/api/nodes').then(r=>r.json());
  _nodes = nd.nodes||[];
  renderCustomNode(_nodes.find(n=>n.id===id));
}

init();
</script>
