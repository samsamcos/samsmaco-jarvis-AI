<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JARVIS Browser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080d;--s1:#0d0f17;--s2:#13151f;--s3:#1a1c28;
  --b1:#1e2030;--b2:#2a2d42;
  --tx:#dde1f5;--tm:#7880a0;--tf:#3a3e55;
  --blue:#6b8cff;--grn:#3fdc8a;--pur:#b57aff;--org:#ff9a4a;
  --red:#ff5f6d;--cyan:#3fd4dc;
  --fm:'JetBrains Mono',monospace;
}
body{font-family:'General Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
.top{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;}
.logo{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;}
.logo-ic{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6b8cff,#b57aff);display:flex;align-items:center;justify-content:center;font-size:.8rem;}
.nav a{font-size:11.5px;color:var(--tm);text-decoration:none;padding:4px 10px;border-radius:5px;transition:color .15s,background .15s;}
.nav a:hover{color:var(--tx);background:var(--s2);}
.nav a.on{color:var(--blue);}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 5px var(--grn);animation:gp 2s ease infinite;flex-shrink:0;}
@keyframes gp{0%,100%{opacity:1}50%{opacity:.3}}
.ml{margin-left:auto;}

/* layout */
.body{display:grid;grid-template-columns:220px 1fr;flex:1;overflow:hidden;min-height:0;}
.sidebar{background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow-y:auto;padding:12px 10px;gap:14px;}
.main{display:flex;flex-direction:column;overflow:hidden;}

/* sidebar sections */
.sh{font-family:var(--fm);font-size:9.5px;color:var(--tf);letter-spacing:.1em;text-transform:uppercase;padding:0 6px;margin-bottom:6px;}

/* site button */
.site-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);cursor:pointer;transition:border-color .15s,background .15s;width:100%;}
.site-btn:hover{border-color:var(--b2);background:var(--s3);}
.site-btn.active{border-color:var(--blue);background:rgba(107,140,255,.08);}
.site-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.site-info{flex:1;text-align:left;}
.site-name{font-size:12px;font-weight:700;margin-bottom:1px;}
.site-url{font-size:10px;color:var(--tm);font-family:var(--fm);}
.site-profile{font-size:9px;color:var(--tf);}
.site-open{font-size:10px;color:var(--blue);background:rgba(107,140,255,.1);border:1px solid rgba(107,140,255,.25);border-radius:5px;padding:3px 8px;flex-shrink:0;cursor:pointer;}
.site-open:hover{background:rgba(107,140,255,.2);}

.add-site-form{background:var(--s2);border:1px solid var(--b1);border-radius:9px;padding:10px;}
.fi{width:100%;background:var(--s3);border:1px solid var(--b1);border-radius:6px;padding:6px 9px;color:var(--tx);font-size:11.5px;outline:none;margin-bottom:6px;transition:border-color .15s;}
.fi:focus{border-color:var(--blue);}
.fi::placeholder{color:var(--tf);}
.add-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:6px;padding:7px;font-size:11.5px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.add-btn:hover{opacity:.85;}

/* main area */
.vnc-topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;}
.vnc-url{flex:1;font-family:var(--fm);font-size:11px;background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:5px 10px;color:var(--cyan);outline:none;transition:border-color .15s;}
.vnc-url:focus{border-color:var(--blue);}
.go-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.go-btn:hover{opacity:.85;}
.vbtn{font-size:10.5px;color:var(--tm);background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;}
.vbtn:hover{color:var(--tx);border-color:var(--b2);}
.vbtn.grn{color:var(--grn);border-color:rgba(63,220,138,.3);background:rgba(63,220,138,.06);}
.vbtn.red{color:var(--red);border-color:rgba(255,95,109,.3);background:rgba(255,95,109,.06);}

/* vnc frame */
.vnc-wrap{flex:1;position:relative;overflow:hidden;background:#000;}
.vnc-frame{width:100%;height:100%;border:none;display:block;}
.vnc-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,8,13,.92);}
.vnc-overlay.hidden{display:none;}
.vo-title{font-size:16px;font-weight:700;}
.vo-sub{font-size:12px;color:var(--tm);}

/* status bar */
.statusbar{height:26px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--s1);border-top:1px solid var(--b1);flex-shrink:0;font-size:10px;color:var(--tm);}
.sb-dot{width:5px;height:5px;border-radius:50%;}
.sb-dot.on{background:var(--grn);}
.sb-dot.off{background:var(--tf);}
#sb-status{color:var(--grn);}
</style>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="top">
  <div class="logo"><div class="logo-ic">🖥</div> JARVIS Browser</div>
  <nav class="nav" style="display:flex;gap:2px;margin-left:16px;">
    <a href="/">Agent</a>
    <a href="/browser" class="on">Browser</a>
    <a href="/sites">Sites</a>
    <a href="/worker">Worker</a>
    <a href="/flights">Flights</a>
    <a href="/about">About</a>
  </nav>
  <div class="ml" style="display:flex;align-items:center;gap:8px;">
    <div class="status-dot"></div>
    <span style="font-size:11px;color:var(--tm);" id="sb-status">VNC ready</span>
    <a href="http://192.168.0.8:6082/vnc.html" target="_blank" style="font-size:10.5px;color:var(--blue);text-decoration:none;border:1px solid rgba(107,140,255,.25);padding:3px 9px;border-radius:5px;">↗ Full VNC</a>
  </div>
</div>

<div class="body">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <!-- Profile 0-4 groups -->
      <div id="profile-sections"></div>
    </div>

    <div style="padding:8px 0;border-top:1px solid var(--b1);margin-top:4px;">
      <a href="/sites" style="display:block;font-size:10.5px;color:var(--blue);text-decoration:none;padding:6px 8px;border-radius:6px;border:1px solid rgba(107,140,255,.2);text-align:center;">+ Manage Sites & Profiles →</a>
    </div>

    <div style="margin-top:auto;padding-top:10px;border-top:1px solid var(--b1);">
      <div class="sh">VNC Controls</div>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <button class="vbtn" onclick="loadVNC()">↺ Reconnect VNC</button>
        <button class="vbtn grn" onclick="openVNCFullscreen()">⛶ Full Screen</button>
        <a href="http://192.168.0.8:6082/vnc.html?autoconnect=1&resize=scale" target="_blank" class="vbtn" style="text-align:center;text-decoration:none;display:block;">↗ New Tab VNC</a>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="vnc-topbar">
      <input class="vnc-url" id="url-bar" placeholder="https://..." value="https://gemini.google.com/app"/>
      <button class="go-btn" onclick="openURL()">Open in Browser</button>
      <button class="vbtn" onclick="takeSnap()">📸 Snap</button>
      <button class="vbtn" onclick="document.getElementById('vnc-frame').src='http://192.168.0.8:6082/vnc.html?autoconnect=1&resize=scale&password='">VNC View</button>
    </div>

    <div class="vnc-wrap">
      <iframe id="vnc-frame" class="vnc-frame" src="http://192.168.0.8:6082/vnc.html?autoconnect=1&resize=scale&password=" allow="fullscreen"></iframe>
      <div class="vnc-overlay hidden" id="vnc-overlay">
        <div style="font-size:2rem">🖥</div>
        <div class="vo-title">Opening browser…</div>
        <div class="vo-sub" id="vo-sub">Starting Playwright on VNC display</div>
      </div>
    </div>

    <div class="statusbar">
      <div class="sb-dot on" id="dot"></div>
      <span id="status-txt">VNC connected — port 5901 → noVNC 6082</span>
      <span style="margin-left:auto;font-family:var(--fm);" id="snap-ts"></span>
    </div>
  </div>
</div>

<script>
const MITOS = 'http://192.168.0.3:9050';
const PROFILE_COLORS = ['#6b8cff','#3fdc8a','#ff9a4a','#b57aff','#f87171'];
const PROFILE_NAMES  = ['Default','Profile 1','Profile 2','Profile 3','Profile 4'];
const profDir = n => n===0?'default':'profile-'+n;

let _allSites = [];

async function loadSites(){
  try{
    const d = await fetch('/api/sites').then(r=>r.json());
    _allSites = d.sites||[];
  }catch{ _allSites=[]; }
  renderProfileSections();
}

function renderProfileSections(){
  const el = document.getElementById('profile-sections');
  el.innerHTML='';
  for(let p=0;p<=4;p++){
    const pSites = _allSites.filter(s=>parseInt(s.profile_num||0)===p);
    const color = PROFILE_COLORS[p];
    const sec = document.createElement('div');
    sec.style='margin-bottom:12px;';
    // Profile header with "Open Chrome" button
    sec.innerHTML=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
      <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></div>
      <span style="font-size:9.5px;font-weight:700;color:${color};letter-spacing:.06em;text-transform:uppercase;flex:1;">${PROFILE_NAMES[p]}</span>
      <button onclick="openProfile(${p})" style="font-size:9px;padding:2px 8px;border-radius:4px;background:${color}22;color:${color};border:1px solid ${color}44;cursor:pointer;font-weight:700;">▶ Open</button>
    </div>
    <div id="prof-sites-${p}" style="display:flex;flex-direction:column;gap:4px;padding-left:14px;"></div>`;
    el.appendChild(sec);

    const container = sec.querySelector('#prof-sites-'+p);
    if(pSites.length===0){
      container.innerHTML=`<div style="font-size:10px;color:var(--tf);padding:3px 0;">No sites — <a href="/sites" style="color:var(--blue);">add on Sites page</a></div>`;
    } else {
      pSites.forEach(s=>{
        const d=document.createElement('div');
        d.className='site-btn';
        d.style='padding:7px 8px;';
        d.innerHTML=`
          <div class="site-ico" style="width:22px;height:22px;border-radius:5px;font-size:.85rem;background:${color}18;color:${color};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${s.icon||'🌐'}</div>
          <div class="site-info">
            <div class="site-name" style="font-size:11.5px;">${esc(s.name)}</div>
            <div class="site-url" style="font-size:9.5px;">${esc((s.url||'').replace('https://','').slice(0,26))}</div>
          </div>
          <button class="site-open" onclick="event.stopPropagation();launchSiteObj(${JSON.stringify(s).replace(/"/g,'&quot;')},${p})">Open</button>
        `;
        d.onclick=()=>{ document.getElementById('url-bar').value=s.url||''; };
        container.appendChild(d);
      });
    }
  }
}

async function openProfile(pNum){
  document.getElementById('status-txt').textContent=`Opening Chrome Profile ${pNum}…`;
  await fetch('/vnc/open',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:'about:blank',profile:profDir(pNum)})});
  document.getElementById('status-txt').textContent=`Profile ${pNum} opened — visible in VNC`;
}

async function launchSiteObj(s, pNum){
  const url = s.login_url||s.url;
  document.getElementById('vnc-overlay').classList.remove('hidden');
  document.getElementById('vo-sub').textContent = `Opening ${s.name} — Profile ${pNum}…`;
  document.getElementById('status-txt').textContent = `Opening ${url}…`;
  document.getElementById('url-bar').value = url;
  try{
    await fetch('/vnc/open',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url, profile:profDir(pNum)})});
    setTimeout(()=>{
      document.getElementById('vnc-overlay').classList.add('hidden');
      document.getElementById('status-txt').textContent = `${s.name} opened in Profile ${pNum} — log in and session saves automatically`;
    }, 2000);
    fetch(MITOS+'/api/link',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:s.name+' (Profile '+pNum+')',url,timeout:0})}).catch(()=>{});
  }catch(e){
    document.getElementById('vnc-overlay').classList.add('hidden');
    document.getElementById('status-txt').textContent = 'Error: '+e.message;
  }
}

async function openURL(){
  const url = document.getElementById('url-bar').value.trim();
  if(!url) return;
  document.getElementById('status-txt').textContent = `Opening ${url}…`;
  try{
    await fetch('/vnc/open',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url, profile:'default'})});
    document.getElementById('status-txt').textContent = 'Browser opened — check VNC';
  }catch(e){ document.getElementById('status-txt').textContent = 'Error: '+e.message; }
}

async function takeSnap(){
  document.getElementById('status-txt').textContent = 'Taking screenshot…';
  try{
    const r = await fetch('/vnc/snap?t='+Date.now());
    if(r.ok){
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='snap.jpg'; a.click();
      document.getElementById('snap-ts').textContent = 'Snap: '+new Date().toLocaleTimeString();
      document.getElementById('status-txt').textContent = 'Screenshot saved';
    }
  }catch(e){ document.getElementById('status-txt').textContent = 'Snap failed'; }
}

function loadVNC(){
  document.getElementById('vnc-frame').src='http://192.168.0.8:6082/vnc.html?autoconnect=1&resize=scale&t='+Date.now();
}

function openVNCFullscreen(){
  const f = document.getElementById('vnc-frame');
  if(f.requestFullscreen) f.requestFullscreen();
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Boot
loadSites();
</script>
<script src="/fix-widget.js"></script>
</body>
</html>
