// ── Snip toggle ──────────────────────────────────────────────────────────────
function snip(id, tab) {
  ['body','n8n','resp','curl'].forEach(t => {
    const e = document.getElementById(id+'-'+t);
    const b = document.getElementById(id+'-tb-'+t);
    if (e) e.style.display = t===tab ? '' : 'none';
    if (b) b.className = t===tab ? 'btn btn-grn' : 'btn btn-ghost';
    if (b) b.style.fontSize='10px';
  });
}
function copy(id) {
  const vis = ['body','n8n','resp','curl'].map(t=>document.getElementById(id+'-'+t)).find(e=>e&&e.style.display!=='none');
  if (!vis) return;
  navigator.clipboard?.writeText(vis.textContent).catch(()=>{
    const ta=document.createElement('textarea');ta.value=vis.textContent;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
  vis.style.outline='2px solid #4ade80';setTimeout(()=>vis.style.outline='',700);
}

// ── Block builder ────────────────────────────────────────────────────────────
function block(title, color, items) {
  return `<div style="border:2px solid ${color};border-radius:10px;padding:16px;margin-bottom:16px">
    <div style="font-size:13px;font-weight:700;color:${color};margin-bottom:14px">${title}</div>
    ${items.map((item, i) => {
      const id = 'wh'+Math.random().toString(36).slice(2,8);
      const method = item.method||'POST';
      const curl = `curl -X ${method} ${BASE}${item.url} \\\n  -H 'Content-Type: application/json' \\\n  -d '${JSON.stringify(item.body,null,2)}'`;
      const n8nNode = `{\n  "method": "${method}",\n  "url": "${BASE}${item.url}",\n  "sendBody": true,\n  "specifyBody": "json",\n  "jsonBody": ${JSON.stringify(JSON.stringify(item.body,null,2))}\n}`;
      return `<div class="wh-card">
        <div class="wh-title">${item.title}</div>
        <div class="wh-url">${method} ${BASE}${item.url}</div>
        <div style="display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap">
          <button id="${id}-tb-body" class="btn btn-grn" style="font-size:10px" onclick="snip('${id}','body')">Body</button>
          <button id="${id}-tb-n8n"  class="btn btn-ghost" style="font-size:10px" onclick="snip('${id}','n8n')">n8n JSON</button>
          <button id="${id}-tb-resp" class="btn btn-ghost" style="font-size:10px" onclick="snip('${id}','resp')">Response</button>
          <button id="${id}-tb-curl" class="btn btn-ghost" style="font-size:10px" onclick="snip('${id}','curl')">cURL</button>
          <button class="btn" style="font-size:10px;margin-left:auto" onclick="copy('${id}')">Copy</button>
        </div>
        <div id="${id}-body" class="code-block">${JSON.stringify(item.body,null,2)}</div>
        <div id="${id}-n8n"  class="code-block" style="display:none">${n8nNode}</div>
        <div id="${id}-resp" class="code-block" style="display:none">${JSON.stringify(item.resp,null,2)}</div>
        <div id="${id}-curl" class="code-block" style="display:none">${curl}</div>
        ${item.note ? `<div class="wh-note">${item.note}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

let currentTab = '';
function switchTab(name) {
  document.querySelectorAll('#tabs button').forEach(b => {
    b.className = b.id === 'tab-'+name ? 'btn btn-grn' : 'btn btn-ghost';
  });
  const fn = TABS[name];
  document.getElementById('content').innerHTML = typeof fn === 'function' ? fn() : fn;
  currentTab = name;
  if (name === 'entry') { setTimeout(b3Load, 50); setTimeout(pb2Load, 80); }

async function tgCheck() {
  const st = document.getElementById('tg-st');
  if (st) { st.textContent='Checking…'; st.style.color='#f5c518'; }
  try {
    const r = await fetch('/telegram/register',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const d = await r.json();
    if (st) { st.textContent = d.ok ? '✓ Polling active — '+d.bot : '✗ '+(d.error||'Error'); st.style.color = d.ok ? '#4ade80' : '#f87171'; }
  } catch(e) { if(st){st.textContent='Error: '+e.message;st.style.color='#f87171';} }
}

async function b3Load() {
  try {
    const d = await (await fetch('/api/bot3/config')).json();
    const t = document.getElementById('b3-token'), c = document.getElementById('b3-chat');
    if (t && d.token && d.token !== '(not set)') t.placeholder = d.token;
    if (c && d.chat_id && d.chat_id !== '(not set)') c.placeholder = d.chat_id;
  } catch(e) {}
}

async function b3Save() {
  const token   = (document.getElementById('b3-token')?.value||'').trim();
  const chat_id = (document.getElementById('b3-chat')?.value||'').trim();
  const st = document.getElementById('b3-st');
  try {
    const d = await (await fetch('/api/bot3/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,chat_id})})).json();
    if (st) { st.textContent = d.ok ? '✓ Saved' : '✗ '+(d.error||'Error'); st.style.color = d.ok ? '#4ade80' : '#f87171'; }
  } catch(e) { if(st){st.textContent='Error: '+e.message;st.style.color='#f87171';} }
}

// ── Pushbullet ───────────────────────────────────────────────────────────────
let _pb2Poll = null;

async function pb2Load() {
  try {
    const d = await (await fetch('/api/bot2pb/config')).json();
    const st = document.getElementById('pb2-status');
    if (st) { st.textContent = d.active ? '🟢 Active' : '⚪ Not configured'; st.style.color = d.active ? '#4ade80' : '#64748b'; }
    if (d.active) { pb2Poll(); if (_pb2Poll) clearInterval(_pb2Poll); _pb2Poll = setInterval(pb2Poll, 4000); }
  } catch(e) {}
}

async function pb2Save() {
  const key = (document.getElementById('pb2-key')?.value||'').trim();
  const st = document.getElementById('pb2-save-status');
  if (!key) { if(st){st.textContent='Enter API key';st.style.color='#f87171';} return; }
  try {
    const d = await (await fetch('/api/bot2pb/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key})})).json();
    if(st){st.textContent=d.ok?'✓ '+d.message:'✗ '+(d.error||'Error');st.style.color=d.ok?'#4ade80':'#f87171';}
    if(d.ok){document.getElementById('pb2-key').value='';pb2Load();}
  } catch(e){if(st){st.textContent='Error: '+e.message;st.style.color='#f87171';}}
}

function pb2Render(msgs) {
  const box = document.getElementById('pb2-chat');
  if (!box || !msgs.length) return;
  box.innerHTML = '';
  msgs.forEach(m => {
    const isMe = m.dir==='incoming';
    const row = document.createElement('div'); row.className = isMe ? 'c-me' : 'c-ai';
    const bub = document.createElement('div'); bub.textContent = m.text;
    row.appendChild(bub); box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

async function pb2Poll() {
  try { const d = await (await fetch('/api/bot2pb/messages')).json(); if(d.ok&&d.messages.length) pb2Render(d.messages); } catch(e) {}
}

async function pb2Send() {
  const inp = document.getElementById('pb2-input');
  const text = (inp?.value||'').trim(); if(!text)return;
  inp.value = '';
  const box = document.getElementById('pb2-chat');
  if (box) {
    const r=document.createElement('div');r.className='c-me';
    const b=document.createElement('div');b.textContent=text;r.appendChild(b);box.appendChild(r);
    const t=document.createElement('div');t.className='c-think';t.id='pb2-think';
    const b2=document.createElement('div');b2.textContent='…';t.appendChild(b2);box.appendChild(t);
    box.scrollTop=box.scrollHeight;
  }
  try {
    await fetch('/api/bot2pb/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    setTimeout(pb2Poll,3000); setTimeout(()=>{document.getElementById('pb2-think')?.remove();pb2Poll();},8000);
  } catch(e){}
}

const DP_ICONS={execute:'⚡',telegram:'✈️',tts:'🔊',mitos:'📱',execute_browser:'🌐',execute_jobs:'🧩'};
const DP_COLORS={execute:'#6b8cff',telegram:'#38bdf8',tts:'#f5c518',mitos:'#fb923c',execute_browser:'#4ade80',execute_jobs:'#c084fc'};

async function dpLoad() {
  const grid = document.getElementById('dp-grid');
  if (!grid) return;
  try {
    const d = await (await fetch('/api/dispatch/hooks')).json();
    const hooks = d.hooks||{};
    grid.innerHTML = Object.entries(hooks).map(([key,url])=>`
      <div class="dp-card">
        <div class="dp-label" style="color:${DP_COLORS[key]||'#94a3b8'}">${DP_ICONS[key]||'•'} ${key.replace(/_/g,' ')}</div>
        <div class="dp-url-text" id="dpu-${key}">${url}</div>
        <div class="dp-actions">
          <button class="btn" onclick="dpCopy('${key}')">Copy</button>
          <button class="btn btn-grn" onclick="dpTest('${key}')">Test</button>
        </div>
        <div class="dp-st" id="dpst-${key}"></div>
      </div>`).join('');
  } catch(e) { if(grid) grid.innerHTML='<div style="color:#f87171;font-size:11px">'+e.message+'</div>'; }
}

function dpCopy(key) {
  const el=document.getElementById('dpu-'+key); if(!el)return;
  navigator.clipboard?.writeText(el.textContent.trim());
  const st=document.getElementById('dpst-'+key);
  if(st){st.textContent='✓ Copied';st.style.color='#4ade80';setTimeout(()=>st.textContent='',2000);}
}

async function dpTest(key) {
  const st=document.getElementById('dpst-'+key);
  const url=(document.getElementById('dpu-'+key)||{}).textContent?.trim();
  if(!url)return;
  if(st){st.textContent='Testing…';st.style.color='#f5c518';}
  try {
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test:true})});
    if(st){st.textContent=`✓ ${r.status}`;st.style.color='#4ade80';}
  } catch(e){if(st){st.textContent='✗ '+e.message;st.style.color='#f87171';}}
}

async function p4Search() {
  const inp = document.getElementById('p4-input');
  const res = document.getElementById('p4-result');
  const msg = (inp?.value||'').trim();
  if (!msg || !res) return;
  res.style.display='';
  res.innerHTML='<div style="color:#f5c518;font-size:11px">Searching…</div>';
  try {
    const d = await (await fetch('/api/jobs/decide',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:msg})
    })).json();
    const sims = d.similar_jobs||[];
    const rec  = d.auto_recommendation||'add_new';
    const cpx  = d.complexity||'complex';
    const recColor = rec==='add_new' ? '#4ade80' : '#f97316';
    const recLabel = rec==='add_new' ? 'PATH 5 — Save as New Blueprint' : 'PATH 6 — Run as Browser Task';
    const simsHtml = sims.length
      ? `<div style="font-size:10px;color:#64748b;margin-bottom:5px">Similar blueprints found:</div>`
        + sims.map(s=>`<div style="background:#0d0f1a;border:1px solid ${s.verified?'#4ade80':'#1e2030'};border-radius:6px;padding:4px 10px;margin-bottom:3px;font-size:10px;color:#94a3b8">
            ${s.verified?'✓ ':''}${s.job_name} <span style="color:#475569">(score:${s.score}${s.verified?' · verified':''})</span>
          </div>`).join('')
      : `<div style="font-size:10px;color:#475569;margin-bottom:5px">No similar blueprints in NocoDB.</div>`;
    const msgEsc = msg.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    res.innerHTML = `
      <div style="background:#0d0f1a;border:1px solid #f97316;border-radius:8px;padding:10px;margin-bottom:8px">
        <div style="font-size:10px;color:#f97316;margin-bottom:6px">${d.reply}</div>
        ${simsHtml}
        <div style="margin-top:6px;padding:5px 8px;background:#0a0c14;border-radius:5px;font-size:10px">
          🧠 AI says this task is <b style="color:${recColor}">${cpx}</b> → recommends
          <b style="color:${recColor}">${recLabel}</b>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="p4Act('${msgEsc}','auto')" class="btn" style="font-size:11px;padding:7px 16px;background:#1a1a0d;border-color:#f5c518;color:#f5c518">
          🤖 Auto-Decide (AI picks)
        </button>
        <button onclick="p4Act('${msgEsc}','add_new')" class="btn btn-grn" style="font-size:11px;padding:7px 14px">
          ➕ PATH 5 — Save Blueprint
        </button>
        <button onclick="p4Act('${msgEsc}','run_browser')" class="btn" style="font-size:11px;padding:7px 14px;border-color:#f97316;color:#f97316;background:#1a0800">
          ▶ PATH 6 — Run Browser Now
        </button>
      </div>
      <div id="p4-act-result" style="margin-top:8px;min-height:13px"></div>`;
  } catch(e) {
    if(res) res.innerHTML=`<div style="color:#f87171;font-size:11px">Error: ${e.message}</div>`;
  }
}

async function p4Act(msg, action) {
  const res = document.getElementById('p4-act-result');
  if(res){res.textContent=action==='add_new'?'⏳ AI generating blueprint…':'⏳ Queuing browser task…';res.style.color='#f5c518';}
  try {
    const d = await (await fetch('/api/jobs/decide',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:msg, action})
    })).json();
    if(res){
      res.innerHTML = action==='add_new'
        ? `<div style="color:#4ade80;font-size:11px">✓ ${d.reply} <span style="color:#475569">id:${d.job_context?.noco_id||'?'}</span></div>`
        : `<div style="color:#f97316;font-size:11px">✓ ${d.reply} — next: <a href="${d.next_url}" style="color:#f97316">${d.next_url}</a></div>`;
    }
    if(action==='add_new') setTimeout(jobsLoad,1000);
  } catch(e) {
    if(res){res.textContent='Error: '+e.message;res.style.color='#f87171';}
  }
}

function jobsLoad() {

    .then(r => r.json())
    .then(d => {

      if (!d.jobs || !d.jobs.length) {
        list.innerHTML = '<div style="color:#475569;font-size:11px">No blueprints yet. Create one above.</div>';

      list.innerHTML = d.jobs.map(j => jobCard(j)).join('');

        ${recurring}
        ${verified}
        <span style="font-size:9px;color:#475569;background:#0d0f1a;padding:2px 6px;border-radius:10px">score:${j.job_score||'?'}</span>
        <span style="font-size:9px;color:#a78bfa;background:#1a1030;padding:2px 6px;border-radius:10px">${j.job_staff||'AI'}</span>
        ${id ? `<button class="btn" onclick="jobDelete(${id})" style="font-size:9px;padding:2px 7px;color:#f87171;border-color:#3a1a1a">✕</button>` : ''}
      </div>
    </div>
    ${scripts.length ? `<div style="font-size:10px;color:#475569;line-height:1.7">
      ${scripts.map((s,i)=>`<span style="color:#6b8cff">${i+1}.</span> ${s}`).join('<br>')}
      ${j.job_scripts.length>4?`<span style="color:#334155"> +${j.job_scripts.length-4} more</span>`:''}
    </div>` : ''}
    ${(j.job_prompts||[]).length ? `<div style="font-size:10px;color:#f5c518;margin-top:6px">❓ ${j.job_prompts.join(' · ')}</div>` : ''}
    ${id && !j.is_verified ? `<div style="font-size:9px;color:#334155;margin-top:5px">Once you confirm this job works, click ✓ Verify — it will skip PATH 4 and go straight to PATH 3 next time.</div>` : ''}
  </div>`;
}

async function jobCreate() {
  const inp  = document.getElementById('jc-input');
  const st   = document.getElementById('jc-status');
  const res  = document.getElementById('jc-result');
  const save = document.getElementById('jc-save');
  const msg  = (inp?.value||'').trim();
  if (!msg) { if(st){st.textContent='Enter a task description';st.style.color='#f87171';} return; }

  if(st){st.textContent='⏳ AI is generating blueprint…';st.style.color='#f5c518';}
  if(res) res.style.display='none';

  try {
    const d = await (await fetch('/api/jobs/create',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg, auto_save: save?.checked !== false})
    })).json();

    if (!d.ok) throw new Error(d.error||'Failed');

    const j = d.job_context;
    const savedTxt = d.saved ? ' · <span style="color:#4ade80">✓ Saved to NocoDB</span>' : '';
    if(st){st.innerHTML=`✓ Blueprint generated for "<b style="color:#e2e8f0">${j.job_name}</b>"${savedTxt}`;st.style.color='#a78bfa';}
    if(res){
      res.style.display='';
      res.innerHTML=jobCard(j);
    }
    if(inp) inp.value='';
    // Refresh list
    setTimeout(jobsLoad, 800);
  } catch(e) {
    if(st){st.textContent='✗ '+e.message;st.style.color='#f87171';}
  }
}

async function jobVerify(id, state) {
  const card = document.getElementById('jcard-'+id);
  try {
    const d = await (await fetch(`/api/jobs/${id}/verify`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({verified: state})
    })).json();
    if(d.ok) setTimeout(jobsLoad, 400);
  } catch(e) {}
}

async function jobDelete(id) {
  if(!confirm('Delete this job blueprint?')) return;
  const card = document.getElementById('jcard-'+id);
  try {
    const d = await (await fetch(`/api/jobs/${id}`,{method:'DELETE'})).json();
    if(d.ok && card) { card.style.opacity='0.3'; card.style.pointerEvents='none'; setTimeout(()=>card.remove(),600); }
  } catch(e) {}
}
